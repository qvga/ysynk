[workspace]
members = ["crates/core", "desktop"]
default-members = ["crates/core"]
resolver = "3"
exclude = ["vendor/glib"]

[workspace.package]
version = "0.5.1"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.91"
publish = false

[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"
tempfile = "=3.27.0"

# Reviewed desktop dependency source fix; see vendor/GLIB_BACKPORT.md.
[patch.crates-io]
glib = { path = "vendor/glib" }
