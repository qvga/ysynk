name: Linux checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev gir1.2-webkit2-4.1 python3-gi xvfb xauth
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/restic.bz2" https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2
          (cd "$RUNNER_TEMP" && echo "680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d  restic.bz2" | sha256sum --check)
          bzip2 -dc "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          sudo install -m 0755 "$RUNNER_TEMP/restic" /usr/bin/restic
      - name: Prepare the checkout
        run: |
          npm ci
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          python3 tools/release-notices.py --fetch-missing
      - name: Check application and tooling
        run: sh tools/check.sh
      - name: Exercise the bundled UI in WebKitGTK
        run: |
          node ui/audit-fixture.mjs
          xvfb-run -a /usr/bin/python3 tools/test-webview.py
      - name: Build Linux release assets
        run: python3 packaging/build-release.py
